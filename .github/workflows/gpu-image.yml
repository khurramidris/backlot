name: GPU worker image

# Builds the RunPod worker image (gpu-worker/Dockerfile) and tests it on CPU on every change to gpu-worker/.
# Pushes to main (or a manual run: Actions → GPU worker image → Run workflow) also publish it as
#   ghcr.io/<owner>/backlot-gpu-worker:latest  and  :<commit>
# which is the image the RunPod endpoint uses (docs/SELF-HOSTED-H3.md).
on:
  push:  # every branch, so a pull request's branch is checked too; only main publishes
    paths: [gpu-worker/**, .github/workflows/gpu-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gpu-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Make room (the CUDA base image is about 20 GB unpacked)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker /etc/docker
          [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json
          sudo jq '. + {"data-root": "/mnt/docker"}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt
      - uses: actions/checkout@v5
      - name: Build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/backlot-gpu-worker"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build -t "$image:${GITHUB_SHA}" gpu-worker
      - name: Worker tests inside the image (CPU, fake ComfyUI)
        run: |
          docker run --rm "$IMAGE:${GITHUB_SHA}" python selftest.py
          docker run --rm "$IMAGE:${GITHUB_SHA}" python test_h3.py
      - name: Publish
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${GITHUB_SHA}" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:latest and $IMAGE:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
